version: '3.8'

# Production-specific overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    # Production-specific settings
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Enhanced logging
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
        labels: "openmanus=true"

    # Production environment overrides
    environment:
      WORKERS: 4
      LOG_LEVEL: INFO

    # Use explicit network configuration
    networks:
      - openmanus-network

    # Security options
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # Resource limits
    ulimits:
      nofile: 65536
      nproc: 32768

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    # Use explicit volume mounts for production
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx

  # Production: Add monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: openmanus-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - openmanus-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Production: Add log aggregation
  logrotate:
    image: blacklabelops/logrotate:latest
    container_name: openmanus-logrotate
    volumes:
      - ./logs:/logs:rw
      - ./docker/logrotate.conf:/etc/logrotate.d/openmanus:ro
    environment:
      CRON_EXPRESSION: "0 0 * * *"  # Daily at midnight
    networks:
      - openmanus-network
    restart: unless-stopped

  # Production: Backup service
  backup:
    image: curlimages/curl:latest
    container_name: openmanus-backup
    volumes:
      - ./config:/backup/config:ro
      - ./workspace:/backup/workspace:ro
      - ./backups:/backups
    environment:
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
    entrypoint: |
      sh -c '
        trap exit TERM
        while true; do
          echo "[$(date)] Running backup..."
          tar -czf /backups/openmanus-backup-$(date +\%Y\%m\%d-\%H\%M\%S).tar.gz \
            -C /backup config workspace 2>/dev/null || true
          echo "[$(date)] Backup completed"
          find /backups -name "openmanus-backup-*.tar.gz" -mtime +7 -delete
          sleep 86400
        done
      '
    networks:
      - openmanus-network
    restart: unless-stopped

volumes:
  prometheus_data:
    driver: local

networks:
  openmanus-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.default_bridge: "false"
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
